<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EEF2F8">
<title>Vibedough</title>
<meta name="description" content="Your Vibedough account: install, earnings and payouts.">
<link rel="preconnect" href="https://mvnfgrydpdwaatkcsrdd.supabase.co" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --linen:#EEF2F8; --linen-2:#E3E9F3; --ink:#14213D; --ink-soft:#4A5878; --cobalt:#2B50C8; --cobalt-deep:#1F3DA0;
  --brass:#B8892B; --term:#0E1730; --term-line:#24325A; --term-text:#D7DEEE; --term-dim:#7F8BAA; --ok:#1F7A55; --err:#B3261E;
  --line:#D5DDEA; --radius:10px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--linen);color:var(--ink);font:400 17px/1.6 "Public Sans",system-ui,sans-serif;min-height:100vh;min-height:100dvh}
a{color:var(--cobalt)}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:20px 0}
.logo{display:flex;align-items:center;gap:10px;font:400 24px/1 "Young Serif",Georgia,serif;color:var(--ink);text-decoration:none}
.logo svg{width:30px;height:30px}
.who{display:flex;align-items:center;gap:14px;font-size:14px;color:var(--ink-soft)}
.who button{font:600 14px/1 "Public Sans",sans-serif;background:none;border:0;color:var(--ink);border-bottom:2px solid var(--brass);padding:0 0 2px;cursor:pointer}
h1{font:400 clamp(32px,4.4vw,48px)/1.08 "Young Serif",Georgia,serif;letter-spacing:-.01em;margin:8px 0 12px}
h2{font:400 26px/1.2 "Young Serif",Georgia,serif;margin:0 0 6px}
.lead{font-size:18px;color:var(--ink-soft);margin:0 0 28px;max-width:52ch}
.card{background:#fff;border-radius:14px;padding:24px;box-shadow:0 1px 0 rgba(20,33,61,.04),0 12px 30px -22px rgba(14,23,48,.35)}
.muted{color:var(--ink-soft)}
.small{font-size:14px}
.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:24px;align-items:start;padding-bottom:64px}
.stack{display:grid;gap:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:var(--radius);border:0;background:var(--cobalt);color:#fff;font:600 16px/1 "Public Sans",sans-serif;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--cobalt-deep)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.ghost:hover{background:var(--linen-2)}
.btn[disabled]{opacity:.7;cursor:progress}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--cobalt);font-weight:600;cursor:pointer;text-decoration:underline}
input.in,select.in{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid #B9C4DA;border-radius:var(--radius);background:#fff;color:var(--ink)}
input.in:focus,select.in:focus{outline:none;border-color:var(--cobalt);box-shadow:0 0 0 3px rgba(43,80,200,.18)}
label.f{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.msg{font-size:14px;min-height:1.4em;margin:8px 0 0}
.msg.err{color:var(--err)} .msg.ok{color:var(--ok)}

/* The install step: the one bold thing, a terminal with your line in it. */
.term{background:var(--term);color:var(--term-text);border-radius:14px;font:400 14px/1.6 "JetBrains Mono",ui-monospace,monospace;overflow:hidden;box-shadow:0 30px 60px -28px rgba(14,23,48,.55)}
.term .bar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--term-line);color:var(--term-dim);font-size:12.5px}
.term .cmd{padding:18px;word-break:break-all;color:#fff}
.term .cmd .p{color:#6B7899;user-select:none}
.term .cmd .code{color:#3DDC97}
.copy{font:600 13px/1 "Public Sans",sans-serif;background:#2B50C8;color:#fff;border:0;border-radius:6px;padding:8px 12px;cursor:pointer}
.copy.done{background:#1F7A55}
ol.how{margin:20px 0 0;padding:0;list-style:none;counter-reset:s;display:grid;gap:14px}
ol.how li{counter-increment:s;display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start}
ol.how li::before{content:counter(s);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink);font:400 15px/1 "Young Serif",serif}
.waiting{display:flex;align-items:center;gap:10px;margin-top:20px;font-size:15px;color:var(--ink-soft)}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--brass);animation:p 1.4s infinite}
@keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--linen-2);border-radius:8px;padding:6px 10px;font:600 14px/1.2 "JetBrains Mono",monospace}

/* Setup checklist */
ul.steps{list-style:none;margin:16px 0 0;padding:0}
ul.steps>li{border-top:1px solid var(--line);padding:16px 0}
ul.steps>li:first-child{border-top:0;padding-top:4px}
.sh{display:flex;align-items:center;gap:12px}
.tick{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 14px/1 "Public Sans";border:1.5px solid #B9C4DA;color:transparent}
.done .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.sh b{font-size:17px}
.sh .val{margin-left:auto;font-size:14px;color:var(--ink-soft);text-align:right}
.sbody{margin:12px 0 0 38px}

/* Earnings */
.money{font:400 clamp(40px,6vw,56px)/1 "Young Serif",Georgia,serif;margin:6px 0 4px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.kv div{background:var(--linen);border-radius:10px;padding:12px 14px}
.kv b{display:block;font-size:20px}
.kv span{font-size:13px;color:var(--ink-soft)}
.locked{position:relative}
.locked .blur{filter:blur(7px);user-select:none;pointer-events:none}
.locked .lock{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px}
.locked .lock p{background:#fff;border-radius:12px;padding:14px 16px;margin:0;max-width:30ch;box-shadow:0 10px 30px -12px rgba(14,23,48,.35);font-size:15px}

/* W-9 */
.w9 fieldset{border:0;padding:0;margin:0}
.radios{display:flex;gap:10px;flex-wrap:wrap}
.radios label{display:inline-flex;align-items:center;gap:6px;border:1.5px solid #B9C4DA;border-radius:999px;padding:8px 14px;font-size:15px;cursor:pointer;background:#fff}
.radios label:has(input:checked){border-color:var(--cobalt);background:#E6ECFB}
.cert{font-size:13px;color:var(--ink-soft);background:var(--linen);border-radius:10px;padding:12px 14px;margin:16px 0 10px}
.cert ol{margin:6px 0 0;padding-left:18px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.check input{margin-top:5px;width:18px;height:18px;accent-color:var(--cobalt)}

/* Sign-in page */
.center{display:grid;place-items:center;padding:24px 0 72px}
.center .card{width:100%;max-width:420px;padding:28px 24px}

/* Mobile: tabs + chat */
.tabs{display:none}
.chat{display:flex;flex-direction:column;height:calc(100dvh - 140px);min-height:420px}
.log{flex:1;overflow-y:auto;padding:8px 0 12px;display:flex;flex-direction:column;gap:12px}
.bubble{max-width:88%;padding:11px 14px;border-radius:16px;font-size:16px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.bubble.me{align-self:flex-end;background:var(--cobalt);color:#fff;border-bottom-right-radius:6px}
.bubble.ai{align-self:flex-start;background:#fff;border-bottom-left-radius:6px}
.bubble.ai pre{background:var(--term);color:var(--term-text);padding:10px;border-radius:8px;overflow-x:auto;font:400 13px/1.5 "JetBrains Mono",monospace;white-space:pre}
.slot{display:contents}
.vslot{display:flex;flex-direction:column}
.thinking{align-self:flex-start;color:var(--ink-soft);font-size:14px;display:flex;align-items:center;gap:8px}
.sponsor{align-self:stretch;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;text-decoration:none;color:var(--ink);background:#fff;border-left:3px solid #6E8BFF;border-radius:10px;padding:10px 12px;font-size:14px}
.sponsor .tag{font:600 10.5px/1.6 "Public Sans",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#0E1730;background:#8EA6FF;border-radius:4px;padding:1px 6px}
.sponsor .cta{color:var(--cobalt);font-weight:600;margin-left:auto}
.compose{display:flex;gap:8px;padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.compose textarea{flex:1;font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid #B9C4DA;border-radius:22px;resize:none;max-height:140px;background:#fff;color:var(--ink)}
.compose textarea:focus{outline:none;border-color:var(--cobalt)}
.compose button{width:48px;height:48px;border-radius:50%;border:0;background:var(--cobalt);color:#fff;font-size:20px;cursor:pointer;flex:none;align-self:flex-end}
.notice{background:#fff;border-radius:12px;padding:12px 14px;font-size:14px;color:var(--ink-soft)}
/* Saved chats: a header with the chat list and New chat */
.chat{position:relative}
.chathead{display:flex;align-items:center;gap:10px;padding:0 0 8px;border-bottom:1px solid var(--line)}
.chathead .ctitle{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatsbtn{font:600 14px/1 "Public Sans",sans-serif;background:var(--linen-2);color:var(--ink);border:0;border-radius:8px;padding:9px 12px;cursor:pointer;flex:none}
.newbtn{font:600 14px/1 "Public Sans",sans-serif;background:none;color:var(--cobalt);border:1.5px solid var(--cobalt);border-radius:8px;padding:8px 12px;cursor:pointer;flex:none}
.chatlist{position:absolute;top:46px;left:0;right:0;max-height:60%;overflow-y:auto;background:#fff;border-radius:12px;box-shadow:0 18px 40px -16px rgba(14,23,48,.45);z-index:5;padding:6px}
.chatlist ul{list-style:none;margin:0;padding:0}
.chatlist li{display:flex;align-items:center;gap:6px;border-radius:8px}
.chatlist li[aria-current=true]{background:#E6ECFB}
.chatlist .open{flex:1;min-width:0;text-align:left;background:none;border:0;padding:10px;cursor:pointer;font:inherit;color:var(--ink)}
.chatlist .open b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatlist .open span{font-size:12.5px;color:var(--ink-soft)}
.chatlist .del{background:none;border:0;color:var(--ink-soft);font-size:18px;width:36px;height:36px;border-radius:8px;cursor:pointer;flex:none}
.chatlist .del:hover{background:var(--linen-2);color:var(--err)}
.chatlist .empty{padding:12px;font-size:14px;color:var(--ink-soft)}
.chatcard{padding:16px 18px}
.chatcard .chat{height:calc(100dvh - 190px);min-height:480px}
.chatcard .bubble.ai,.chatcard .sponsor,.chatcard .notice{background:var(--linen)}
.skip{margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}
/* Live earnings */
.live{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-soft);margin:2px 0 14px}
.live .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:p 2s infinite;flex:none}
.live b{color:var(--ink);font-size:16px}
.rate{font-size:13.5px;color:var(--ink-soft);background:var(--linen);border-radius:10px;padding:10px 12px;margin:14px 0 0}
.skeleton{height:160px;border-radius:14px;background:linear-gradient(90deg,#E3E9F3,#EEF2F8,#E3E9F3);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}

@media (max-width:900px){ .grid{grid-template-columns:1fr} }
@media (max-width:520px){
  body{font-size:16px}
  .wrap{padding:0 16px}
  header.top{padding:14px 0}
  .card{padding:18px}
  .row{flex-direction:column;gap:0}
  .kv{grid-template-columns:1fr 1fr}
  .who span{display:none}
}
body.mobile .tabs{display:flex;gap:6px;background:var(--linen-2);border-radius:12px;padding:4px;margin:0 0 12px}
body.mobile .tabs button{flex:1;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.1;border:0;border-radius:9px;background:transparent;font:600 15px/1 "Public Sans",sans-serif;color:var(--ink-soft);cursor:pointer}
body.mobile .tabs button[aria-selected=true]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(14,23,48,.12)}
body.mobile .tabs button small{font:500 11.5px/1 "Public Sans",sans-serif;color:var(--brass)}
@media (prefers-reduced-motion:reduce){.pulse,.skeleton,.live .dot{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="logo" href="/" aria-label="Vibedough home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M12.5 12.5 8.5 4.5l6.2 5.2Z" fill="#14213D"/><path d="M19.5 12.5l4-8-6.2 5.2Z" fill="#14213D"/><path d="M9.5 13.5c1.6-1.4 4-2 6.5-2s4.9.6 6.5 2c3 2.6 4.6 6.2 4 9.3-.6 3.2-4.6 5.2-10.5 5.2S6.1 26 5.5 22.8c-.6-3.1 1-6.7 4-9.3Z" fill="#2B50C8"/><ellipse cx="16" cy="11.2" rx="3.2" ry="2.1" fill="#B8892B"/></svg>
      vibedough
    </a>
    <div class="who" id="who" hidden><span id="who-email"></span><button type="button" id="signout">Sign out</button></div>
  </header>
  <main id="main" aria-live="polite"><div class="skeleton" aria-label="Loading"></div></main>
</div>

<script src="/auth.js"></script>
<script>
(() => {
  const main = document.getElementById("main");
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const money = (n) => "$" + Number(n || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const num = (n) => Number(n || 0).toLocaleString("en-US");
  // Phones and tablets get the chat; computers get the install step until it checks in.
  const mobile = (navigator.userAgentData && navigator.userAgentData.mobile) || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)
    || (matchMedia("(pointer: coarse)").matches && innerWidth < 900);
  document.body.classList.toggle("mobile", mobile);
  let acct = null, poll = null, live = null, tab = "chat", liveAt = 0;

  const STATES = "AL AK AZ AR CA CO CT DE DC FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY AS GU MP PR VI AA AE AP".split(" ");
  const CLASSES = [["individual", "Individual / sole proprietor"], ["llc_s", "LLC taxed as S corp"], ["llc_c", "LLC taxed as C corp"], ["llc_p", "LLC taxed as partnership"], ["s_corp", "S corporation"], ["c_corp", "C corporation"], ["partnership", "Partnership"], ["trust_estate", "Trust / estate"], ["other", "Other"]];

  function signedOutView(note) {
    stopPoll(); stopLive();
    document.getElementById("who").hidden = true;
    main.innerHTML = `<div class="center"><div class="card"><div id="si"></div></div></div>`;
    if (note) main.querySelector(".card").insertAdjacentHTML("afterbegin", `<p class="msg err" style="margin:0 0 12px">${esc(note)}</p>`);
    VD.mountSignIn(document.getElementById("si"), { title: "Sign in to Vibedough", sub: "New here? This creates your free account.", onSignedIn: load });
  }

  async function load() {
    const r = await VD.api("/account/me");
    if (r.status === 401) return signedOutView();
    if (r.status !== 200) { main.innerHTML = `<div class="center"><div class="card"><h2>We hit a snag.</h2><p class="muted">${esc(r.data.error || "Try again in a minute.")}</p><button class="btn" id="retry">Try again</button></div></div>`; document.getElementById("retry").onclick = load; return; }
    acct = r.data; liveAt = Date.now();
    document.getElementById("who").hidden = false;
    document.getElementById("who-email").textContent = acct.email;
    render();
  }

  // Computers: the install step until it checks in, unless they chose "just use the chat". Then the
  // chat beside live earnings. Phones: Chat and Earnings tabs.
  function render() {
    if (mobile) return renderMobile();
    if (!acct.installed && !acct.web_only) return renderInstall();
    stopPoll();
    renderHome();
  }

  // ------------------------------------------------------------ install (desktop)
  function renderInstall() {
    stopLive();
    const skip = acct.web_only
      ? `<div class="skip"><button class="btn ghost" type="button" data-go="back">Back to the chat</button></div>`
      : `<div class="skip"><p style="margin:0 0 4px"><b>No Claude Code, or no paid Claude plan?</b></p><p class="small muted" style="margin:0 0 12px">Skip this step and use the Vibedough chat in your browser. It's free, your chats are saved, and you earn the same way. You can add Claude Code any time.</p><button class="btn ghost" type="button" data-go="webonly">Skip, just use the chat</button><p class="msg" role="alert"></p></div>`;
    main.innerHTML = `<div class="grid"><div>
      <h1>One line and you're earning.</h1>
      <p class="lead">Paste this into your terminal. It adds Vibedough to Claude Code and links it to your account with your code.</p>
      <div class="term"><div class="bar"><span>terminal</span><button class="copy" type="button" data-copy="${esc(acct.install_command)}">Copy</button></div>
        <div class="cmd"><span class="p">$ </span>${esc(acct.install_command).replace(esc(acct.install_code), `<span class="code">${esc(acct.install_code)}</span>`)}</div></div>
      <ol class="how">
        <li><div><b>Paste it in your terminal</b> and press Enter.</div></li>
        <li><div><b>Start Claude Code</b> (or type <code>/reload-plugins</code> if it's already open).</div></li>
        <li><div><b>That's it.</b> This page updates by itself when your install checks in.</div></li>
      </ol>
      <div class="waiting" role="status"><span class="pulse" aria-hidden="true"></span>Waiting for your install…</div>
      <p class="small muted" style="margin-top:22px">Already have Vibedough in Claude Code? Type <span class="chip">/earn link ${esc(acct.install_code)} <button class="copy" type="button" data-copy="/earn link ${esc(acct.install_code)}">Copy</button></span> there instead. Needs Claude Code 2.1.275 or later (<code>claude update</code>).</p>
      ${skip}
    </div><div class="stack">${setupCard(true)}</div></div>`;
    wire(main);
    startPoll();
  }

  function startPoll() {
    stopPoll();
    let n = 0;
    poll = setInterval(async () => {
      if (document.hidden) return;
      if (++n > 300) return stopPoll(); // ~20 minutes
      const r = await VD.api("/account/me");
      if (r.status === 200 && r.data.installed) { acct = r.data; stopPoll(); render(); }
    }, 4000);
  }
  function stopPoll() { if (poll) clearInterval(poll); poll = null; }

  // ------------------------------------------------------------ dashboard
  // Earnings and setup only (the phone's Earnings tab).
  function renderDashboard(host) {
    host.innerHTML = `<div class="grid"><div class="stack">${earningsCard()}</div><div class="stack">${setupCard(false)}${codeCard()}</div></div>`;
    wire(host);
    startLive();
  }

  // Computer, once installed or chat-only: the chat beside live earnings.
  function renderHome() {
    main.innerHTML = `<div class="grid"><section class="card chatcard" aria-label="Chat"><div id="pane"></div></section>
      <div class="stack">${earningsCard()}${setupCard(false)}${codeCard()}</div></div>`;
    wire(main);
    renderChat(document.getElementById("pane"));
    startLive();
  }

  // Live: while an earnings card is on screen and the page is in front, re-read the account every
  // 15 seconds (and right after a view is reported) and redraw just that card.
  function startLive() { stopLive(); live = setInterval(refreshEarnings, 15000); }
  function stopLive() { if (live) clearInterval(live); live = null; }
  let refreshing = false;
  async function refreshEarnings() {
    if (document.hidden || refreshing || !document.getElementById("earn-card")) return;
    refreshing = true;
    try {
      const r = await VD.api("/account/me").catch(() => ({ status: 0 }));
      if (r.status === 401) return signedOutView("Your session expired. Sign in again.");
      if (r.status !== 200) return;
      const wasInstalled = acct.installed;
      acct = r.data; liveAt = Date.now();
      const el = document.getElementById("earn-card");
      if (el) el.outerHTML = earningsCard();
      // An install that just checked in: redraw the setup card's tick too (keeps the chat as it is).
      if (!wasInstalled && acct.installed) { const s = document.getElementById("setup-card"); if (s) { s.outerHTML = setupCard(false); wire(document.getElementById("setup-card")); } }
    } finally { refreshing = false; }
  }
  setInterval(() => { const u = document.getElementById("live-at"); if (u) u.textContent = updated(); }, 5000);
  const updated = () => { const s = Math.round((Date.now() - liveAt) / 1000); return s < 10 ? "updated just now" : s < 120 ? `updated ${s}s ago` : `updated ${Math.round(s / 60)} min ago`; };
  const day = (d) => { try { return new Date(d).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" }); } catch (_) { return String(d); } };
  const rateMoney = (n) => "$" + Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 4 });

  // Views today count across every install and the web chat, live, even before payout setup. Dollar
  // figures come only from the last confirmed settlement: your share of what Velocity actually paid.
  function earningsCard() {
    const e = acct.earnings;

  // ------------------------------------------------------------ Velocity Web SDK (default)

  const vlcSiteUrl = () => (/(^|\.)vibedough\.com$/.test(location.hostname) ? "https://vibedough.com" : location.origin) + location.pathname;
  let sdkReady = null, sdkFailedAt = 0, sdkCleanup = null;
  function loadSdkScript() {
    if (window.VelocitySDK) return Promise.resolve(window.VelocitySDK);
    return new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = VSDK.src; s.integrity = VSDK.sri; s.crossOrigin = "anonymous"; s.async = true;
      s.onload = () => (window.VelocitySDK ? resolve(window.VelocitySDK) : reject(new Error("no VelocitySDK")));
      s.onerror = () => reject(new Error("sdk script failed"));
      document.head.appendChild(s);

  // Resolves to the initialized SDK, or null. Init runs once; a failure is retried after a minute.
  function velocitySdk() {
    if (!sdkReady) {
      if (sdkFailedAt && Date.now() - sdkFailedAt < 60000) return Promise.resolve(null);
      sdkReady = loadSdkScript().then(async (VelocitySDK) => {
        const sdk = new VelocitySDK({ publisherKey: VSDK.key, siteUrl: vlcSiteUrl(), timeout: VSDK.ms, ...(vlcDev ? { devMode: true } : {}) });
        // CCPA: honor Global Privacy Control as a "Do Not Sell or Share" opt-out (we have no CMP).
        if (navigator.globalPrivacyControl === true) sdk.setDoNotSell(true);
        if (acct && acct.ad_user_id) sdk.setPublisherUserId(String(acct.ad_user_id));
        const r = await sdk.init();
        if (!r || !r.success) throw new Error((r && r.error && r.error.message) || "init failed");
        window.__vdVelocity = { mode: "sdk", init: "ok", site: vlcSiteUrl(), unit: VSDK.unit, dev: vlcDev, loads: [] };
        return sdk;
      }).catch((e) => {
        window.__vdVelocity = { mode: "sdk", init: "failed", error: String(e && e.message || e) };
        sdkReady = null; sdkFailedAt = Date.now(); return null;
      });
    }
    return sdkReady;
  }
  const vlcNonce = () => Array.from(crypto.getRandomValues(new Uint8Array(6)), (x) => x.toString(16).padStart(2, "0")).join("");
  // One SDK-tracked ad in `slot` for this message. The view credits the account when the SDK fires it.
  async function showSponsorSdk(slot, log, query) {

  let vlcReady = null, vlcFailedAt = 0, vlcDepth = 1;

      <div class="chatlist" id="chat-list" hidden></div>
      <div class="log" id="log" aria-live="polite"></div>
      <form class="compose" id="compose"><textarea id="q" rows="1" placeholder="Ask anything…" aria-label="Message"></textarea><button type="submit" aria-label="Send">↑</button></form></div>`;
    const log = pane.querySelector("#log"), form = pane.querySelector("#compose"), q = pane.querySelector("#q");
    const list = pane.querySelector("#chat-list"), listBtn = pane.querySelector("#chats-btn"), titleEl = pane.querySelector("#ctitle");
    let busy = false;

    function paint() {
      titleEl.textContent = chatTitle;
      log.innerHTML = chatLog.length ? chatLog.map(bubble).join("") : WELCOME;
      log.scrollTop = log.scrollHeight;
    }
    async function loadChat() {
      if (chatLoaded) return paint();
      log.innerHTML = `<div class="thinking"><span class="pulse"></span>Opening your chat…</div>`;
      const want = chatId;
      const r = await VD.api("/account/chats/" + encodeURIComponent(chatId)).catch(() => ({ status: 0, data: {} }));
      if (want !== chatId) return; // they picked another chat meanwhile
      if (r.status === 401) return signedOutView("Your session expired. Sign in again.");
      if (r.status === 200 && r.data.chat) {
        chatTitle = r.data.chat.title; chatLog = (r.data.messages || []).map((m) => ({ role: m.role, content: m.content })); chatLoaded = true;
        return paint();
      }
      if (r.status === 404) { openChat(null); return paint(); } // deleted elsewhere
      log.innerHTML = `<div class="notice">Couldn't open that chat. <button class="linkbtn" type="button" id="retry-chat">Try again</button></div>`;
      log.querySelector("#retry-chat").onclick = loadChat;
    }

    function closeList() { list.hidden = true; listBtn.setAttribute("aria-expanded", "false"); }
    async function showList() {
      list.hidden = false; listBtn.setAttribute("aria-expanded", "true");
      list.innerHTML = `<div class="empty">Loading your chats…</div>`;
      const r = await VD.api("/account/chats").catch(() => ({ status: 0, data: {} }));
      if (list.hidden) return;
      if (r.status === 401) return signedOutView("Your session expired. Sign in again.");
      if (r.status !== 200) { list.innerHTML = `<div class="empty">Couldn't load your chats. Try again in a moment.</div>`; return; }
      const chats = r.data.chats || [];
      if (!chats.length) { list.innerHTML = `<div class="empty">No saved chats yet. Send a message and it's saved here.</div>`; return; }
      list.innerHTML = `<ul>${chats.map((c) => `<li ${c.id === chatId ? 'aria-current="true"' : ""}><button class="open" type="button" data-id="${esc(c.id)}" data-title="${esc(c.title)}"><b>${esc(c.title)}</b><span>${esc(ago(c.updated_at))}</span></button><button class="del" type="button" data-del="${esc(c.id)}" aria-label="Delete chat: ${esc(c.title)}">×</button></li>`).join("")}</ul>`;
      list.querySelectorAll("[data-id]").forEach((b) => b.onclick = () => { closeList(); if (b.dataset.id !== chatId) { openChat(b.dataset.id, b.dataset.title); loadChat(); } });
      list.querySelectorAll("[data-del]").forEach((b) => b.onclick = async () => {
        if (!confirm("Delete this chat? This can't be undone.")) return;
        const d = await VD.api("/account/chats/delete", { id: b.dataset.del }).catch(() => ({ status: 0 }));
        if (d.status === 200 || d.status === 404) {
          if (b.dataset.del === chatId) { openChat(null); paint(); }
          b.closest("li").remove();
          if (!list.querySelector("li")) list.innerHTML = `<div class="empty">No saved chats yet.</div>`;
        }
      });
    }
    listBtn.onclick = () => (list.hidden ? showList() : closeList());
    pane.querySelector("#new-chat").onclick = () => { if (busy) return; closeList(); openChat(null); paint(); q.focus(); };
    pane.addEventListener("keydown", (e) => { if (e.key === "Escape" && !list.hidden) { closeList(); listBtn.focus(); } });

    q.addEventListener("input", () => { q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 140) + "px"; });
    q.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !mobile) { e.preventDefault(); form.requestSubmit(); } });
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = q.value.trim();
      if (!text || busy) return;
      busy = true; closeList();
      q.value = ""; q.style.height = "auto";
      log.querySelector(".notice")?.remove();
      const sentIn = chatId;
      chatLog.push({ role: "user", content: text });
      // The slot keeps the sponsored line in place above the reply, whichever arrives first.
      log.insertAdjacentHTML("beforeend", `${bubble({ role: "user", content: text })}<div class="slot"></div><div class="thinking"><span class="pulse"></span>Thinking…</div>`);
      log.scrollTop = log.scrollHeight;
      const slots = log.querySelectorAll(".slot"), slot = slots[slots.length - 1];
      const thinking = log.querySelector(".thinking");
      showSponsor(slot, log, text.slice(0, 500)).catch(() => {});
      const r = await VD.api("/account/chat", { message: text, chat_id: chatId || undefined }).catch(() => ({ status: 0, data: {} }));
      busy = false;
      thinking.remove();
      if (sentIn !== chatId) return; // switched chats while waiting; the reply is saved in the other chat
      if (r.status === 200 && r.data.reply) {
        if (r.data.chat_id) { chatId = r.data.chat_id; ss.set("vd_chat_id", chatId); chatLoaded = true; }
        if (r.data.title) { chatTitle = r.data.title; titleEl.textContent = chatTitle; }
        chatLog.push({ role: "assistant", content: r.data.reply });
        log.insertAdjacentHTML("beforeend", bubble({ role: "assistant", content: r.data.reply }));
      } else {
        if (r.status === 401) return signedOutView("Your session expired. Sign in again.");
        chatLog.pop();
        if (r.status === 404 && sentIn) openChat(null);
        q.value = text; // nothing was saved: give their message back
        log.insertAdjacentHTML("beforeend", `<div class="notice">${esc(r.data.error || "Couldn't reach us. Check your connection and try again.")}</div>`);
      }
      log.scrollTop = log.scrollHeight;
    });
    loadChat();
  }

  // ------------------------------------------------------------ shared wiring
  function wire(host) {
    host.querySelectorAll("[data-copy]").forEach((b) => b.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(b.dataset.copy); } catch (_) { const t = document.createElement("textarea"); t.value = b.dataset.copy; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
      if (b.classList.contains("copy")) { const was = b.textContent; b.textContent = "Copied"; b.classList.add("done"); setTimeout(() => { b.textContent = was; b.classList.remove("done"); }, 1600); }
    }));
    host.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", async () => {
      const go = b.dataset.go;
      if (go === "w9") return renderW9();
      if (go === "back") return load();
      if (go === "install") return renderInstall();
      if (go === "webonly") {
        b.disabled = true;
        const r = await VD.api("/account/web-only", { on: true }).catch(() => ({ status: 0, data: {} }));
        b.disabled = false;
        if (r.status === 200) { acct.web_only = true; stopPoll(); return render(); }
        if (r.status === 401) return signedOutView("Your session expired. Sign in again.");
        const m = b.parentElement.querySelector(".msg");
        if (m) { m.className = "msg err"; m.textContent = (r.data && r.data.error) || "That didn't work. Try again in a moment."; }
        return;
      }
      if (go === "rotate") {
        if (!confirm("Get a new install code? The old one stops working for new installs. Installs already linked stay linked.")) return;
        const r = await VD.api("/account/code", {});
        if (r.status === 200) load();
      }
    }));
    host.querySelectorAll("form.pp").forEach((f) => f.addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = f.querySelector("input"), msg = f.querySelector(".msg");
      msg.className = "msg"; msg.textContent = "";
      if (!input.checkValidity() || !input.value.trim()) { msg.className = "msg err"; msg.textContent = "Enter the email your PayPal account uses."; return; }
      const r = await VD.api("/account/paypal", { email: input.value.trim() });
      if (r.status === 200) return load();
      msg.className = "msg err"; msg.textContent = r.data.error || "That didn't save. Try again.";
    }));
  }

  document.getElementById("signout").addEventListener("click", () => { VD.signOut(); openChat(null); ss.set("vd_chat", null); signedOutView(); });
  // Back from a tab: refresh, so an install that checked in meanwhile shows up.
  // On the chat and earnings views, just refresh the earnings (never redraw the chat under them).
  document.addEventListener("visibilitychange", () => {
    if (document.hidden || !acct) return;
    if (!mobile && !acct.installed && !acct.web_only) return load();
    refreshEarnings();
  });

  (async () => {
    const done = await VD.finishFromUrl();
    if (done && done.error) return signedOutView(done.error);
    if (!(await VD.session())) return signedOutView();
    load();
  })();
})();
</script>
</body>
</html>
