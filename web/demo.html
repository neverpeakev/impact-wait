<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goodwait demo</title>
<style>
  :root { --bg:#fbfaf7; --fg:#141414; --muted:#666; --line:#e6e3dc; --card:#fff; --me:#ececec; --good:#12805c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#131313; --fg:#eee; --muted:#a3a3a3; --line:#2c2c2c; --card:#1b1b1b; --me:#2a2a2a; --good:#3ecf8e; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  main { max-width:720px; margin:0 auto; padding:28px 16px 160px; }
  header { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  header a { color:var(--muted); font-size:14px; }
  .note { color:var(--muted); font-size:14px; margin:4px 0 22px; }
  .msg { margin:12px 0; padding:10px 14px; border-radius:14px; max-width:85%; white-space:pre-wrap; }
  .me { background:var(--me); margin-left:auto; }
  .ai { border:1px solid var(--line); background:var(--card); }
  .thinking { color:var(--muted); font-size:14px; margin:10px 0 6px; }
  .thinking::after { content:"..."; animation:dots 1.2s steps(4) infinite; display:inline-block; width:1.2em; overflow:hidden; vertical-align:bottom; }
  @keyframes dots { from { width:0 } to { width:1.2em } }
  form { position:fixed; left:0; right:0; bottom:0; padding:14px 16px 18px; background:linear-gradient(transparent, var(--bg) 30%); }
  .box { max-width:720px; margin:0 auto; display:flex; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:8px; }
  input { flex:1; border:0; outline:none; background:transparent; color:var(--fg); font:inherit; padding:6px 8px; min-width:0; }
  button { border:0; border-radius:10px; padding:8px 14px; font:inherit; font-weight:650; background:var(--fg); color:var(--bg); cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .chips button { background:var(--card); color:var(--fg); border:1px solid var(--line); font-weight:500; font-size:14px; padding:5px 10px; }
</style>
</head>
<body>
<main>
  <header><b>Goodwait demo chat</b><a href="/">Live counter</a></header>
  <p class="note">This fake assistant "thinks" for a few seconds so you can see the sponsored line. The ad and the counter are real.</p>
  <div id="thread"></div>
  <div id="slot" hidden>
    <div class="thinking">Thinking</div>
    <good-wait id="iw" site="demo" linger="2500"></good-wait>
  </div>
</main>
<form id="f">
  <div class="box" style="flex-direction:column">
    <div class="chips" id="chips">
      <button type="button">Best Postgres host for a small SaaS?</button>
      <button type="button">Help me write an email to my team</button>
      <button type="button">Summarize my meeting notes</button>
    </div>
    <div style="display:flex; gap:8px"><input id="q" placeholder="Ask anything..." autocomplete="off" maxlength="500"><button id="send">Send</button></div>
  </div>
</form>
<script src="/goodwait.js"></script>
<script>
  const thread = document.getElementById("thread"), slot = document.getElementById("slot"), iw = document.getElementById("iw");
  const q = document.getElementById("q"), send = document.getElementById("send");
  const add = (cls, text) => { const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text; thread.append(d); d.scrollIntoView({ block: "end" }); return d; };
  document.getElementById("chips").addEventListener("click", (e) => { if (e.target.tagName === "BUTTON") { q.value = e.target.textContent; ask(); } });
  document.getElementById("f").addEventListener("submit", (e) => { e.preventDefault(); ask(); });
  function ask() {
    const text = q.value.trim(); if (!text || send.disabled) return;
    q.value = ""; send.disabled = true;
    add("me", text);
    thread.after(slot); slot.hidden = false;
    iw.query = text; iw.active = true;
    setTimeout(() => {
      iw.active = false;
      slot.querySelector(".thinking").hidden = true;
      add("ai", "This is a demo, so there's no real answer here. In a real app, the model's reply streams in while the sponsored line stays up for a moment, then fades.");
      setTimeout(() => { if (!iw.active) { slot.hidden = true; slot.querySelector(".thinking").hidden = false; } }, 2700);
      send.disabled = false; q.focus();
    }, 5000);
  }
</script>
</body>
</html>
